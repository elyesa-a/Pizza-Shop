services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pizzaservice_web
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app:/var/www/html
    environment:
      TZ: "Europe/Berlin"
      DB_HOST: db
      DB_USER: public
      DB_PASSWORD: public
      DB_NAME: pizzaservice
    depends_on:
      - db

  db:
    image: mariadb:11
    container_name: pizzaservice_db
    volumes:
      - db-data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    environment:
      TZ: "Europe/Berlin"
      MARIADB_ROOT_PASSWORD: "root"
      MARIADB_USER: public
      MARIADB_PASSWORD: public

  phpmyadmin:
    image: phpmyadmin:5
    container_name: pizzaservice_phpmyadmin
    ports:
      - "127.0.0.1:8085:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db-data:
